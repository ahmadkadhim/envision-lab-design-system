<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--el-off-white); font-family: var(--el-font-sans); }
  .wrap { max-width: 880px; margin: 0 auto; }
  .heading { font-family: var(--el-font-mono); font-size: 9pt; font-weight: 500; color: var(--el-fg-3); text-transform: uppercase; letter-spacing: var(--el-track-caps); margin-bottom: 18px; }
  .row { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
  .step { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .bar { background: var(--el-navy); height: 22px; }
  .name { font-family: var(--el-font-mono); font-weight: 500; font-size: 9pt; letter-spacing: var(--el-track-caps); color: var(--el-fg-3); text-transform: uppercase; }
  .val { font-family: var(--el-font-mono); font-size: 9pt; color: var(--el-fg-1); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="heading">Spacing scale · pt-based</div>
    <div class="row">
      <div class="step"><div class="bar" style="width:4pt"></div><div class="name">sp-1</div><div class="val">4pt</div></div>
      <div class="step"><div class="bar" style="width:8pt"></div><div class="name">sp-2</div><div class="val">8pt</div></div>
      <div class="step"><div class="bar" style="width:12pt"></div><div class="name">sp-3</div><div class="val">12pt</div></div>
      <div class="step"><div class="bar" style="width:16pt"></div><div class="name">sp-4</div><div class="val">16pt</div></div>
      <div class="step"><div class="bar" style="width:24pt"></div><div class="name">sp-5</div><div class="val">24pt</div></div>
      <div class="step"><div class="bar" style="width:32pt"></div><div class="name">sp-6</div><div class="val">32pt</div></div>
      <div class="step"><div class="bar" style="width:48pt"></div><div class="name">sp-7</div><div class="val">48pt</div></div>
      <div class="step"><div class="bar" style="width:64pt"></div><div class="name">sp-8</div><div class="val">64pt</div></div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icons — Tabler curated</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--el-off-white); }
  .wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 16px; }
  .h { font-family: var(--el-font-mono); font-size: 9pt; font-weight: 500; color: var(--el-fg-3); text-transform: uppercase; letter-spacing: var(--el-track-caps); margin-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: var(--el-off-white-2); padding: 14px; border: 1px solid var(--el-rule); }
  .ic { display: grid; place-items: center; gap: 4px; padding: 14px 6px; }
  .ic svg { color: var(--el-navy); width: 24px; height: 24px; }
  .ic .n { font-family: var(--el-font-mono); font-size: 8pt; color: var(--el-fg-3); text-align: center; }

  .recipe { background: var(--el-navy); color: var(--el-on-navy-2); padding: 18px 20px; font-family: var(--el-font-mono); font-size: 9.5pt; line-height: 1.5; }
  .recipe .h2 { font-family: var(--el-font-mono); color: var(--el-gold-warm); text-transform: uppercase; letter-spacing: var(--el-track-caps); font-size: 9pt; margin-bottom: 10px; }
  .recipe code { color: var(--el-on-navy-1); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="h">Curated 28 · 2px stroke · 24×24 · currentColor</div>
    <div id="grid" class="grid"></div>

    <div class="recipe">
      <div class="h2">Edge cases · pull from Tabler CDN</div>
      Inline from <code>https://unpkg.com/@tabler/icons/icons/outline/[name].svg</code><br/>
      then set <code>stroke="currentColor"</code> · recolour with <code>color: var(--el-navy)</code> on light, <code>color: var(--el-gold-warm)</code> on navy.
    </div>
  </div>
  <script>
    const names = ["arrow-right","arrow-up-right","arrow-down-left","chevron-right","chevron-down","asterisk","check","circle-check","x","plus","minus","point-filled","calendar","calendar-event","clock","user","users","building","map-pin","world","chart-bar","chart-line","clipboard-check","currency-dollar","target","flag","compass","award","mail","phone","school","presentation"];
    const grid = document.getElementById('grid');
    Promise.all(names.map(n => fetch('../assets/icons/' + n + '.svg').then(r => r.text()).then(svg => ({n, svg}))))
      .then(items => {
        items.forEach(({n, svg}) => {
          const w = document.createElement('div');
          w.className = 'ic';
          w.innerHTML = svg + '<div class="n">' + n + '</div>';
          grid.appendChild(w);
        });
      });
  </script>
</body>
</html>

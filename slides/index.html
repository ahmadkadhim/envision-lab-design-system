<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Envision Lab — Deck overview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: #2A2A28; font-family: var(--el-font-sans); color: #BDB8AE; }
  .header { padding: 28px 40px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .header .t { font-family: var(--el-font-display); font-size: 22pt; color: #F6F2EA; font-weight: 400; letter-spacing: -0.01em; }
  .header .m { font-family: var(--el-font-mono); font-size: 9pt; color: var(--el-gold-warm); text-transform: uppercase; letter-spacing: var(--el-track-caps); }
  .stack { display: grid; gap: 28px; padding: 14px 40px 60px; justify-items: center; }
  .stack-row { display: grid; grid-template-rows: auto auto; gap: 6px; }
  .stack-row .lbl { font-family: var(--el-font-mono); font-size: 9pt; color: #8A847A; text-transform: uppercase; letter-spacing: var(--el-track-caps); display: flex; gap: 14px; align-items: baseline; }
  .stack-row .lbl .n { color: var(--el-gold-warm); }
  .frame { width: 960px; height: 540px; border: 1px solid #3A3A38; overflow: hidden; background: var(--el-cream); }
  .frame iframe { width: 960px; height: 540px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="header">
    <div class="t">Envision Lab · proposal deck v5</div>
    <div class="m">13 slides · scroll to browse</div>
  </div>

  <div class="stack">
    <div class="stack-row"><div class="lbl"><span class="n">01</span><span>Cover</span></div><div class="frame"><iframe src="cover.html?v=8" loading="lazy" title="Cover"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">02</span><span>Table of contents</span></div><div class="frame"><iframe src="table-of-contents.html?v=8" loading="lazy" title="Contents"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">03</span><span>Why Envision Lab</span></div><div class="frame"><iframe src="why-envision-lab.html?v=8" loading="lazy" title="Why Envision Lab"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">04</span><span>Programme</span></div><div class="frame"><iframe src="section-opener.html?v=8" loading="lazy" title="Programme"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">05</span><span>At a glance</span></div><div class="frame"><iframe src="at-a-glance.html?v=8" loading="lazy" title="At a glance"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">06</span><span>Programme arc</span></div><div class="frame"><iframe src="programme-arc.html?v=8" loading="lazy" title="Programme arc"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">07</span><span>Programme flow</span></div><div class="frame"><iframe src="programme-flow.html?v=8" loading="lazy" title="Programme flow"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">08</span><span>Frameworks</span></div><div class="frame"><iframe src="frameworks.html?v=8" loading="lazy" title="Frameworks"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">09</span><span>Simulation</span></div><div class="frame"><iframe src="simulation.html?v=8" loading="lazy" title="Simulation"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">10</span><span>Learning outcomes</span></div><div class="frame"><iframe src="outcomes.html?v=8" loading="lazy" title="Learning outcomes"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">11</span><span>Delivery team</span></div><div class="frame"><iframe src="delivery-team.html?v=8" loading="lazy" title="Delivery team"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">12</span><span>Thank you</span></div><div class="frame"><iframe src="thank-you.html?v=8" loading="lazy" title="Thank you"></iframe></div></div>
    <div class="stack-row"><div class="lbl"><span class="n">13</span><span>Timeline</span></div><div class="frame"><iframe src="timeline.html?v=8" loading="lazy" title="Timeline"></iframe></div></div>
  </div>
</body>
</html>

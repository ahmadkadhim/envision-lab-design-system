<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
  
  <defs>
    <pattern id="lattice" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
      <g transform="translate(80 80)">
        <polygon points="0,-70 20,-20 70,0 20,20 0,70 -20,20 -70,0 -20,-20"></polygon>
        <polygon points="0,-70 20,-20 70,0 20,20 0,70 -20,20 -70,0 -20,-20" transform="rotate(45)"></polygon>
        <circle r="22"></circle>
      </g>
      <g transform="translate(0 0)" opacity="0.6">
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9"></polygon>
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" transform="rotate(45)"></polygon>
      </g>
      <g transform="translate(160 0)" opacity="0.6">
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9"></polygon>
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" transform="rotate(45)"></polygon>
      </g>
      <g transform="translate(0 160)" opacity="0.6">
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9"></polygon>
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" transform="rotate(45)"></polygon>
      </g>
      <g transform="translate(160 160)" opacity="0.6">
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9"></polygon>
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" transform="rotate(45)"></polygon>
      </g>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="url(#lattice)"></rect>
</svg>